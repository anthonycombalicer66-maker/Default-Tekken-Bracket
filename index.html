<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEKKEN 7 Bracket</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--panel:#141418;--line:#2a2a31;--red:#e10a1a;--gold:#f5b800;--text:#f2f2f2;--dim:#8a8a94;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Rajdhani',Arial,sans-serif;font-weight:500;
background-image:repeating-linear-gradient(135deg,rgba(225,10,26,.05) 0 2px,transparent 2px 22px),radial-gradient(ellipse at top,rgba(225,10,26,.25),transparent 60%)}
header{text-align:center;padding:28px 16px 8px}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(44px,9vw,92px);margin:0;letter-spacing:4px;line-height:1;
color:var(--text);text-shadow:3px 3px 0 var(--red),6px 6px 0 #000}
h1 span{color:var(--gold)}
.sub{color:var(--dim);letter-spacing:6px;font-size:14px;text-transform:uppercase;margin-top:6px}
main{max-width:1400px;margin:0 auto;padding:12px 16px 48px}
.panel{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);padding:14px 16px;margin-bottom:20px;
clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:160px;background:#0c0c0f;border:1px solid var(--line);color:var(--text);padding:10px 12px;font:inherit;font-size:18px;outline:none}
input:focus{border-color:var(--gold)}
button{font-family:'Bebas Neue',Impact,sans-serif;font-size:19px;letter-spacing:2px;padding:9px 16px;border:0;cursor:pointer;color:#fff;background:var(--red);
clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
button:hover{background:#ff2a38}
button.alt{background:#2c2c34}button.alt:hover{background:#3b3b46}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:8px;background:#0c0c0f;border:1px solid var(--line);padding:5px 6px 5px 10px;font-size:17px;font-weight:700}
.chip i{font-style:normal;color:var(--gold);font-family:'Bebas Neue';font-size:16px}
.chip b{cursor:pointer;color:var(--dim);padding:0 6px;font-size:18px}.chip b:hover{color:var(--red)}
.note{color:var(--dim);font-size:14px;margin-top:10px;min-height:18px}
h2{font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;letter-spacing:3px;margin:0 0 10px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--red),transparent)}
h2.l{color:#7fb2ff}h2.l::after{background:linear-gradient(90deg,#4a86e8,transparent)}
h2.g{color:var(--gold)}h2.g::after{background:linear-gradient(90deg,var(--gold),transparent)}
.scroll{overflow-x:auto;padding-bottom:12px;margin-bottom:22px}
.rounds{display:flex;gap:26px;width:max-content;align-items:stretch}
.round{display:flex;flex-direction:column;width:210px}
.rl{font-family:'Bebas Neue';letter-spacing:2px;color:var(--dim);font-size:18px;margin-bottom:8px}
.col{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px}
.m{background:var(--panel);border:1px solid var(--line);position:relative}
.m.skip{display:none}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:17px;font-weight:700;min-height:38px;border-left:4px solid transparent}
.row+.row{border-top:1px solid var(--line)}
.row.empty{color:#4a4a54;font-weight:500}
.row.bye{color:#4a4a54;font-style:italic;font-weight:500}
.row.pick{cursor:pointer}.row.pick:hover{background:rgba(245,184,0,.12);border-left-color:var(--gold)}
.row.win{background:rgba(225,10,26,.22);border-left-color:var(--red);color:#fff}
.row.win::after{content:"WIN";font-family:'Bebas Neue';color:var(--gold);letter-spacing:2px;font-size:15px}
.row.lose{color:#5d5d68;text-decoration:line-through}
.m.live{border-color:var(--gold)}
.champ{text-align:center;padding:26px 12px;margin-bottom:22px;border:2px solid var(--gold);background:linear-gradient(180deg,rgba(245,184,0,.16),transparent)}
.champ small{display:block;letter-spacing:8px;color:var(--gold);font-size:15px}
.champ div{font-family:'Bebas Neue';font-size:clamp(46px,10vw,100px);letter-spacing:5px;text-shadow:3px 3px 0 var(--red);line-height:1.1}
.chip em{font-style:normal;color:var(--dim);font-size:14px;cursor:pointer}.chip em:hover{color:var(--gold)}
.sc{font-family:'Bebas Neue';font-size:20px;color:var(--gold);margin-left:auto;padding-left:8px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--dim);font-size:15px;letter-spacing:1px}.stats b{color:var(--gold)}
select{background:#0c0c0f;border:1px solid var(--line);color:var(--text);padding:9px;font:inherit;font-size:17px}
.ko{font-family:'Bebas Neue';color:var(--red);font-size:22px;letter-spacing:3px}
*{-webkit-tap-highlight-color:transparent}
button,select{min-height:44px;touch-action:manipulation}
input{font-size:16px}
.chip b{padding:6px 10px}.chip em{padding:6px 2px}
.scroll{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.round{scroll-snap-align:start}
.scroll::before{content:"swipe sideways for more rounds \2192";display:none;color:var(--dim);font-size:13px;letter-spacing:1px;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.mbox{width:100%;max-width:380px;background:var(--panel);border:2px solid var(--red);padding:18px;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.mbox input{width:100%}
.ml{font-family:'Bebas Neue';font-size:24px;letter-spacing:2px;color:var(--gold);margin-bottom:10px}
@media(max-width:600px){main{padding:8px 10px 40px}.round{width:178px}.rounds{gap:16px}
.bar>button,.bar>select{flex:1 1 44%}.bar input{flex:1 1 100%}
.row{padding:10px;min-height:44px}h2{font-size:28px}.sub{letter-spacing:3px;font-size:12px}.scroll::before{display:block}}

.tabs{display:flex;gap:10px;justify-content:center;padding:10px 16px 0}
.tabs button{min-width:150px}
body.view #admin{display:none}
body.view .row.pick{pointer-events:none}

</style>
</head>
<body class="view">
<header>
<h1>TEKKEN <span>7</span></h1>
<div class="sub">Double Elimination Tournament</div>
</header>
<nav class="tabs"><button id="tview">SEE BRACKET</button><button class="alt" id="tedit">EDIT BRACKET</button></nav>
<main>
<section class="panel" id="admin">
<div class="bar">
<input id="name" placeholder="Enter fighter name..." maxlength="24" autocomplete="off">
<button id="add">ADD FIGHTER</button>
<button class="alt" id="shuf">SHUFFLE</button>
<button class="alt" id="undo">UNDO</button>
<select id="ft" title="Match format"><option value="1">Single game</option><option value="2">First to 2 (Bo3)</option><option value="3">First to 3 (Bo5)</option><option value="4">First to 4 (Bo7)</option></select>
<button class="alt" id="rst">RESET RESULTS</button>
<button class="alt" id="clr">CLEAR ALL</button>
<button class="alt" id="bulk">BULK ADD</button>
<button class="alt" id="exp">COPY BRACKET</button>
</div>
<textarea id="bulkbox" placeholder="One fighter per line, then press BULK ADD again" style="display:none;width:100%;margin-top:10px;min-height:90px;background:#0c0c0f;border:1px solid var(--line);color:var(--text);padding:10px;font:inherit;font-size:17px"></textarea>
<div class="chips" id="chips"></div>
<div class="note" id="note">Add at least 2 fighters. Click a fighter in a match to advance them. Click the winner again to undo.</div>
</section>
<div id="out"></div>
</main>
<div id="modal" class="modal" hidden><div class="mbox"><div class="ml" id="mtitle"></div><input id="minput" maxlength="16" placeholder="e.g. Kazuya" autocomplete="off"><div class="bar" style="margin-top:12px"><button id="msave">SAVE</button><button class="alt" id="mclear">CLEAR</button><button class="alt" id="mcancel">CANCEL</button></div></div></div>
<div id="pw" class="modal" hidden><div class="mbox"><div class="ml">ADMIN PASSWORD</div><input id="pwin" type="password" inputmode="numeric" placeholder="Enter password" autocomplete="off"><div class="note" id="pwerr" style="color:var(--red)"></div><div class="bar" style="margin-top:12px"><button id="pwok">UNLOCK</button><button class="alt" id="pwcancel">CANCEL</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
let players=[],results={},scores={},ft=1,uid=1,hist=[];
const DB='';/* paste your Firebase Realtime Database URL here, e.g. https://my-bracket-default-rtdb.firebaseio.com */
const apply=s=>{players=s.players||[];results=s.results||{};scores=s.scores||{};ft=s.ft||1;uid=s.uid||1};
const load=()=>{try{const s=JSON.parse(localStorage.getItem('t7bracket'));if(s)apply(s)}catch(e){}};let admin=false;load();
/* default roster: used whenever there is no saved roster */
if(!players.length){players=['Jan','Mark David','Jeric','Anthony','Justin Dhale','Dylan','Kylle','Romy','Kenneth John','Kimbert'].map((n,i)=>({id:'p'+(i+1),name:n}));results={};scores={};uid=players.length+1}
const save=()=>{if(!admin)return;const d={players,results,scores,ft,uid};try{localStorage.setItem('t7bracket',JSON.stringify(d))}catch(e){}if(DB)fetch(DB+'/bracket.json',{method:'PUT',body:JSON.stringify(d)}).catch(()=>{})};
const snap=()=>{hist.push(JSON.stringify({players,results,scores,ft,uid}));if(hist.length>100)hist.shift()};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seedOrder=n=>{let a=[1];while(a.length<n){const m=a.length*2+1;a=a.flatMap(x=>[x,m-x])}return a};

function build(){
 const n=players.length;if(n<2)return null;
 const k=Math.max(2,Math.ceil(Math.log2(n))),size=2**k,M={};
 const mk=(b,r,i)=>M[b+r+'-'+i]={id:b+r+'-'+i,b,r,i,s:[null,null],w:null,l:null,done:false,skip:false,win:null,lose:null};
 for(let r=1;r<=k;r++)for(let i=0;i<size/2**r;i++)mk('W',r,i);
 for(let j=1;j<k;j++)for(let i=0;i<size/2**(j+1);i++){mk('L',2*j-1,i);mk('L',2*j,i)}
 mk('G',1,0);mk('G',2,0);
 const id=(b,r,i)=>b+r+'-'+i;
 for(let r=1;r<=k;r++)for(let i=0;i<size/2**r;i++){
  const m=M[id('W',r,i)];
  m.win=r<k?[id('W',r+1,i>>1),i%2]:[id('G',1,0),0];
  if(r===1)m.lose=[id('L',1,i>>1),i%2];
  else{const c=size/2**r;m.lose=[id('L',2*(r-1),c-1-i),1]}
 }
 for(let j=1;j<k;j++){const c=size/2**(j+1);
  for(let i=0;i<c;i++){
   M[id('L',2*j-1,i)].win=[id('L',2*j,i),0];
   M[id('L',2*j,i)].win=j<k-1?[id('L',2*j+1,i>>1),i%2]:[id('G',1,0),1];
  }}
 const B=x=>({id:'bye'+x,bye:true,name:'BYE'});
 seedOrder(size).forEach((seed,x)=>{M[id('W',1,x>>1)].s[x%2]=seed<=n?players[seed-1]:B(x)});
 let ch=true;
 while(ch){ch=false;for(const m of Object.values(M)){
  if(m.done||m.skip)continue;
  const[a,b]=m.s;if(!a||!b)continue;
  let w=null;
  if(a.bye||b.bye)w=a.bye?b:a;
  else if(results[m.id]===a.id)w=a;else if(results[m.id]===b.id)w=b;
  if(!w)continue;
  m.done=true;m.w=w;m.l=w===a?b:a;ch=true;
  if(m.b==='G'){if(m.r===1){if(w===b)M['G2-0'].s=[a,b];else M['G2-0'].skip=true}continue}
  M[m.win[0]].s[m.win[1]]=w;if(m.lose)M[m.lose[0]].s[m.lose[1]]=m.l;
 }}
 for(const key of Object.keys(results)){const m=M[key];if(!m||!m.w||m.w.id!==results[key])delete results[key]}
 for(const key of Object.keys(scores)){const m=M[key],c=scores[key];if(!m||!m.s[0]||!m.s[1]||m.s[0].id!==c.ids[0]||m.s[1].id!==c.ids[1])delete scores[key]}
 return{M,k};
}

function card(m){
 const live=m.s[0]&&m.s[1]&&!m.done&&!m.s[0].bye&&!m.s[1].bye;
 const row=p=>{
  if(!p)return'<div class="row empty">TBD</div>';
  if(p.bye)return'<div class="row bye">BYE</div>';
  const cls=['row'];
  if(m.done&&!(m.s[0].bye||m.s[1].bye))cls.push(m.w===p?'win':'lose');
  if(m.s[0]&&m.s[1]&&!m.s[0].bye&&!m.s[1].bye)cls.push('pick');
  const both=m.s[0]&&m.s[1]&&!m.s[0].bye&&!m.s[1].bye,c=scores[m.id],sc=ft>1&&both?'<span class="sc">'+(c?c.v[m.s[0]===p?0:1]:0)+'</span>':'';
  return`<div class="${cls.join(' ')}" data-m="${m.id}" data-p="${p.id}"><span>${esc(p.name)}${p.ch?' <small style="color:var(--dim);font-weight:500">('+esc(p.ch)+')</small>':''}</span>${sc}</div>`;
 };
 return`<div class="m${live?' live':''}${m.skip?' skip':''}">${row(m.s[0])}${row(m.s[1])}</div>`;
}

function section(M,b,rounds,title,cls,label){
 let h=`<h2 class="${cls}">${title}</h2><div class="scroll"><div class="rounds">`;
 rounds.forEach((r,idx)=>{
  const ms=Object.values(M).filter(m=>m.b===b&&m.r===r).sort((x,y)=>x.i-y.i);
  if(!ms.length||ms.every(m=>m.skip))return;
  h+=`<div class="round"><div class="rl">${label(r,idx,rounds.length)}</div><div class="col">${ms.map(card).join('')}</div></div>`;
 });
 return h+'</div></div>';
}

function render(){
 $('#chips').innerHTML=players.map((p,i)=>`<div class="chip"><i>#${i+1}</i>${esc(p.name)}<em data-ed="${p.id}" title="Set character">${p.ch?esc(p.ch):'+char'}</em><b data-rm="${p.id}" title="Remove">✕</b></div>`).join('');
 const B=build(),out=$('#out');
 if(!B){out.innerHTML='<div class="panel"><span class="ko">NO CHALLENGERS</span> — add at least 2 fighters to generate the bracket.</div>';save();return}
 const{M,k}=B;
 const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
 const real=Object.values(M).filter(m=>!(m.s[0]&&m.s[0].bye)&&!(m.s[1]&&m.s[1].bye)&&!m.skip&&m.b!=='G'||m.b==='G'&&m.r===1);
 const total=real.length,done=real.filter(m=>m.done).length;
 const losses={};players.forEach(p=>losses[p.id]=0);
 Object.values(M).forEach(m=>{if(m.done&&m.l&&!m.l.bye&&!m.s[0].bye&&!m.s[1].bye&&!(m.b==='G'&&m.r===2&&0))losses[m.l.id]++});
 const out2=players.filter(p=>losses[p.id]>=2).map(p=>p.name);
 let h=`<div class="stats"><span>MATCHES <b>${done}/${total}</b></span><span>FIGHTERS <b>${players.length}</b></span><span>ELIMINATED <b>${out2.length?esc(out2.join(', ')):'none'}</b></span></div><br>`;
 const g1=M['G1-0'],g2=M['G2-0'];
 let champ=null;
 if(g1.done){if(g1.w===g1.s[0])champ=g1.w;else if(g2.done)champ=g2.w}
 if(champ)h+=`<div class="champ"><small>WINNER</small><div>${esc(champ.name)}</div></div>`;
 h+=section(M,'W',range(1,k),'WINNERS BRACKET','',(r)=>r===k?'WINNERS FINAL':'ROUND '+r);
 h+=section(M,'L',range(1,2*(k-1)),'LOSERS BRACKET','l',(r,i,t)=>r===t?'LOSERS FINAL':'ROUND '+r);
 const gm=[g1];if(!g2.skip)gm.push(g2);
 h+=`<h2 class="g">GRAND FINAL</h2><div class="scroll"><div class="rounds">`+
  gm.map((m,i)=>`<div class="round"><div class="rl">${i?'BRACKET RESET':'GRAND FINAL'}</div>${card(m)}</div>`).join('')+'</div></div>';
 out.innerHTML=h;save();
}

function setNote(t){$('#note').textContent=t}
function add(){
 const v=$('#name').value.trim();if(!v)return;
 if(players.some(p=>p.name.toLowerCase()===v.toLowerCase())){setNote('That fighter is already in the roster.');return}
 snap();players.push({id:'p'+uid++,name:v});$('#name').value='';
 results={};scores={};setNote('Fighter added. Bracket regenerated and results reset.');render();
}
$('#add').onclick=add;
$('#name').onkeydown=e=>{if(e.key==='Enter')add()};
$('#shuf').onclick=()=>{snap();for(let i=players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[players[i],players[j]]=[players[j],players[i]]}results={};scores={};setNote('Seeds shuffled.');render()};
$('#rst').onclick=()=>{snap();results={};scores={};setNote('Results reset.');render()};
$('#clr').onclick=()=>{snap();players=[];results={};scores={};setNote('Roster cleared.');render()};
document.addEventListener('click',e=>{
 if(!admin)return;
 const ed=e.target.closest('[data-ed]');
 if(ed){openChar(ed.dataset.ed);return}
 const rm=e.target.closest('[data-rm]');
 if(rm){snap();players=players.filter(p=>p.id!==rm.dataset.rm);results={};scores={};setNote('Fighter removed. Bracket regenerated and results reset.');render();return}
 const r=e.target.closest('.row.pick');
 if(r){const m=r.dataset.m,p=r.dataset.p;snap();
  if(ft<=1){if(results[m]===p)delete results[m];else results[m]=p}
  else if(results[m]){delete results[m];delete scores[m]}
  else{const mm=build().M[m],c=scores[m]||(scores[m]={ids:[mm.s[0].id,mm.s[1].id],v:[0,0]}),i=mm.s[0].id===p?0:1;c.v[i]++;if(c.v[i]>=ft)results[m]=p}
  render()}
});
$('#bulk').onclick=()=>{
 const box=$('#bulkbox');
 if(box.style.display==='none'){box.style.display='block';box.focus();return}
 const names=box.value.split('\n').map(x=>x.trim()).filter(Boolean);
 let added=0;snap();
 names.forEach(v=>{if(!players.some(p=>p.name.toLowerCase()===v.toLowerCase())){players.push({id:'p'+uid++,name:v.slice(0,24)});added++}});
 box.value='';box.style.display='none';results={};scores={};setNote(added+' fighter(s) added. Results reset.');render();
};
$('#exp').onclick=()=>{
 const B=build();if(!B){setNote('Nothing to copy yet.');return}
 const lines=Object.values(B.M).filter(m=>m.done&&!m.s[0].bye&&!m.s[1].bye).map(m=>m.id+': '+m.s[0].name+' vs '+m.s[1].name+' -> '+m.w.name+(scores[m.id]?' ('+scores[m.id].v.join('-')+')':''));
 const txt='TEKKEN 7 RESULTS\n'+lines.join('\n');
 (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>setNote('Results copied to clipboard.'),()=>{$('#bulkbox').style.display='block';$('#bulkbox').value=txt;setNote('Copy the text below.')});
};
$('#ft').value=ft;
$('#ft').onchange=e=>{snap();ft=+e.target.value;results={};scores={};setNote('Match format changed. Results reset.');render()};
$('#undo').onclick=()=>{const t=hist.pop();if(!t){setNote('Nothing to undo.');return}const o=JSON.parse(t);players=o.players;results=o.results;scores=o.scores;ft=o.ft;uid=o.uid;$('#ft').value=ft;setNote('Undone.');render()};
let editId=null;
function openChar(id){const p=players.find(x=>x.id===id);if(!p)return;editId=id;$('#mtitle').textContent='CHARACTER FOR '+p.name.toUpperCase();$('#minput').value=p.ch||'';$('#modal').hidden=false;$('#minput').focus()}
function saveChar(v){const p=players.find(x=>x.id===editId);$('#modal').hidden=true;if(!p)return;snap();p.ch=v.trim().slice(0,16);render()}
$('#msave').onclick=()=>saveChar($('#minput').value);
$('#mclear').onclick=()=>saveChar('');
$('#mcancel').onclick=()=>{$('#modal').hidden=true};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').hidden=true};
$('#minput').onkeydown=e=>{if(e.key==='Enter')saveChar(e.target.value);if(e.key==='Escape')$('#modal').hidden=true};
const PW='192208';
const setMode=a=>{admin=a;document.body.classList.toggle('view',!a);document.body.classList.toggle('edit',a);$('#tview').classList.toggle('alt',a);$('#tedit').classList.toggle('alt',!a)};
let unlocked=false;try{unlocked=sessionStorage.getItem('t7admin')==='1'}catch(e){}
$('#tview').onclick=()=>{setMode(false);load();render()};
const enter=async()=>{load();if(DB){try{const s=await(await fetch(DB+'/bracket.json')).json();if(s)apply(s)}catch(e){}}hist=[];$('#ft').value=ft;setMode(true);render()};
$('#tedit').onclick=()=>{if(admin)return;if(unlocked){enter();return}$('#pwerr').textContent='';$('#pwin').value='';$('#pw').hidden=false;$('#pwin').focus()};
